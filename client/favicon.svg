<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Ocean background -->
  <rect width="32" height="32" fill="#0a2540"/>
  <!-- Head outline (dark pink) -->
  <rect x="9" y="3" width="14" height="14" fill="#C44569"/>
  <!-- Head body (light pink) -->
  <rect x="10" y="4" width="12" height="11" fill="#FF6B9D"/>
  <!-- Belly highlight -->
  <rect x="11" y="10" width="10" height="4" fill="#FFB6C1"/>
  <!-- Eyes white -->
  <rect x="12" y="8" width="3" height="3" fill="#FFFFFF"/>
  <rect x="17" y="8" width="3" height="3" fill="#FFFFFF"/>
  <!-- Eye pupils -->
  <rect x="13" y="9" width="2" height="2" fill="#000"/>
  <rect x="18" y="9" width="2" height="2" fill="#000"/>
  <!-- Tentacles -->
  <rect x="9" y="17" width="3" height="11" fill="#FF6B9D"/>
  <rect x="13" y="17" width="3" height="11" fill="#C44569"/>
  <rect x="16" y="17" width="3" height="11" fill="#FF6B9D"/>
  <rect x="20" y="17" width="3" height="11" fill="#C44569"/>
  <!-- Tentacle tips -->
  <rect x="9" y="27" width="3" height="2" fill="#C44569"/>
  <rect x="13" y="27" width="3" height="2" fill="#FF6B9D"/>
  <rect x="16" y="27" width="3" height="2" fill="#C44569"/>
  <rect x="20" y="27" width="3" height="2" fill="#FF6B9D"/>
  <!-- Crown accent (gold pixel) - subtle royal -->
  <rect x="14" y="2" width="4" height="1" fill="#FFD700"/>
  <rect x="15" y="1" width="2" height="1" fill="#FFD700"/>
</svg>
