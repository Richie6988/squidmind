<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquidMind - Agent Aquarium</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <meta name="theme-color" content="#0a2540">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/pixel.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <h1>SquidMind</h1>
      <div class="header-nav">
        <button class="btn-nav" onclick="AgentForm.openNew()">+ New Agent</button>
<button class="btn-nav" onclick="ModelLoader.open()">[MODELS] Models</button>
        <button class="btn-nav" onclick="ui.openLogsModal()">[LOGS] Logs</button>
        <button class="btn-nav comms-nav-btn" onclick="CommsPanel.open()" title="Remote comms (Telegram/Discord)">📡 Comms</button>
      </div>
      <div class="header-stats">
        <span id="api-status" title="API connection">●</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container">
    
    <!-- Aquarium Canvas -->
    <div class="aquarium-wrapper">
      <canvas id="aquarium"></canvas>
    </div>
    
    <!-- Projects Container (temples + new project button + search) -->
    <div class="projects-container" id="projects-container">
      <button class="btn-new-project-card" onclick="window.ui.openNewProjectModal()">
        + New Project
      </button>
      <div class="projects-search-wrap">
        <input id="projects-search-input" type="text" placeholder="Search..." class="projects-search-input">
      </div>
      <div id="temple-cards-list" class="temple-cards-list">
        <!-- Temple cards populated by ProjectsPanel.render() -->
      </div>
    </div>
    
    <!-- Control Panels (legacy modals - hidden by default, shown as floating) -->
    <div class="panels-container">
      
      
      
      <!-- Logs moved to modal overlay (see #logs-modal below) -->

    </div>
    <!-- /.panels-container -->

    <!-- CONTROL TOWER (right panel) - sibling of aquarium and panels -->
    <div id="right-panel" class="right-panel-permanent">
      <!-- Drag handle for resizing -->
      <div id="right-panel-resizer" class="right-panel-resizer" title="Drag to resize panel"></div>
      <div class="right-panel-header">
        <h2>[SYSTEM] Control Tower</h2>
      </div>
      <div class="right-panel-content">
        
        <!-- System Resources (live from heartbeat) -->
        <div class="monitor-section">
          <h3>Resources</h3>
          <div id="monitor-system-stats">
            <div class="stat-item" title="CPU: Central Processing Unit. Shows what % of your processor is being used by all running programs.">
              <span class="stat-label">CPU</span>
              <div class="stat-bar">
                <div id="monitor-cpu-bar" class="stat-fill"></div>
              </div>
              <span id="monitor-cpu-value" class="stat-value">--</span>
            </div>
            <div class="stat-item" title="RAM: Random Access Memory. Your system's working memory. High usage can slow down the server.">
              <span class="stat-label">RAM</span>
              <div class="stat-bar">
                <div id="monitor-mem-bar" class="stat-fill"></div>
              </div>
              <span id="monitor-mem-value" class="stat-value">--</span>
            </div>
            <div class="stat-item" title="VRAM: Video RAM. Memory on your GPU, used to hold AI model weights. Too full = model won't load.">
              <span class="stat-label">VRAM</span>
              <div class="stat-bar">
                <div id="monitor-vram-bar" class="stat-fill"></div>
              </div>
              <span id="monitor-vram-value" class="stat-value">--</span>
            </div>
            <div class="stat-row" style="margin-top:4px;">
              <span>Model:</span>
              <span id="monitor-model-pill" style="font-size:8px; color:var(--text-secondary);">none</span>
            </div>
          </div>
        </div>
        
        <!-- Squad (live from agent_registry) -->
        <div class="monitor-section">
          <h3>Squad</h3>
          <div id="monitor-squad-stats">
            <div class="stat-row"><span>Total:</span><span id="monitor-total-squids">0</span></div>
            <div class="stat-row"><span>Active:</span><span id="monitor-active-squids">0</span></div>
            <div class="stat-row"><span>Sleeping:</span><span id="monitor-sleeping-squids">0</span></div>
            <div class="stat-row"><span>Working:</span><span id="monitor-working-squids">0</span></div>
          </div>
        </div>
        
        <!-- Task Queue (interactive) -->
        <div class="monitor-section">
          <h3>Task Queue</h3>
          <div id="task-queue" style="max-height: 280px; overflow-y: auto;">
            <p class="hint" style="font-size: 9px; color: var(--text-secondary);">Loading...</p>
          </div>

        </div>
        
        <!-- Scheduler (create recurring tasks without Poseidon) -->
        <div class="monitor-section">
          <h3>Scheduler</h3>
          <div id="scheduler-stats" style="font-size:9px; color:var(--text-secondary); margin-bottom:6px;">
            <span id="scheduler-count">0</span> scheduled
          </div>
          <button class="btn-secondary" onclick="Scheduler.open()" style="width: 100%; font-size: 9px;">
            + Schedule Task
          </button>
        </div>
      </div>
    </div>
    <!-- /#right-panel -->

  </div>
  <!-- /.main-container -->

  <!-- New Project Modal -->
  <div id="new-project-modal" class="squid-detail-modal hidden">
    <div class="squid-detail-content">
      <div class="squid-detail-header">
        <h2 class="squid-detail-title">Create New Project</h2>
        <button class="squid-detail-close" onclick="window.ui.closeNewProjectModal()">Close</button>
      </div>
      
      <div class="squid-detail-section">
        <div class="squid-detail-field">
          <label>Project Name *</label>
          <input type="text" id="new-project-name" placeholder="MY_PROJECT" />
        </div>
        
        <div class="squid-detail-field">
          <label>Vision / Description</label>
          <textarea id="new-project-vision" placeholder="What is this project about?"></textarea>
        </div>
        
        <div class="squid-detail-field">
          <label>Temple Outside Color</label>
          <input type="color" id="new-project-color-outside" value="#667eea" />
        </div>
        
        <div class="squid-detail-field">
          <label>Temple Inside Color</label>
          <input type="color" id="new-project-color-inside" value="#764ba2" />
        </div>
      </div>
      
      <button class="squid-detail-save" onclick="window.ui.createNewProject()">
        Create Project
      </button>
    </div>
  </div>

  <!-- Scripts - ui.js MUST load FIRST! -->
  <!-- LOGS MODAL -->
  <!-- LOGS MODAL -->
  <div id="logs-modal" class="modal hidden">
    <div class="lm-modal">
      <!-- Header -->
      <div class="lm-header">
        <div class="lm-title">
          <span class="lm-icon">◈</span>
          <span>SYSTEM LOGS</span>
        </div>
        <div class="lm-header-right">
          <button class="lm-refresh" onclick="ui.openLogsModal()" title="Refresh">↺</button>
          <button class="lm-close" onclick="document.getElementById('logs-modal').classList.add('hidden')">✕</button>
        </div>
      </div>

      <!-- Filter tabs + severity + search -->
      <div class="lm-filters">
        <div class="lm-filter-row">
          <button class="lm-tab active" data-cat="all"      onclick="ui.setLogFilter(this,'all')">All</button>
          <button class="lm-tab"        data-cat="poseidon" onclick="ui.setLogFilter(this,'poseidon')">🔱 Poseidon</button>
          <button class="lm-tab"        data-cat="agent"    onclick="ui.setLogFilter(this,'agent')">🤖 Agents</button>
          <button class="lm-tab"        data-cat="task"     onclick="ui.setLogFilter(this,'task')">✦ Tasks</button>
          <button class="lm-tab"        data-cat="project"  onclick="ui.setLogFilter(this,'project')">📁 Projects</button>
          <button class="lm-tab"        data-cat="model"    onclick="ui.setLogFilter(this,'model')">📦 Models</button>
          <button class="lm-tab"        data-cat="error"    onclick="ui.setLogFilter(this,'error')">⚠ Errors</button>
          <button class="lm-tab"        data-cat="system"   onclick="ui.setLogFilter(this,'system')">⚙ System</button>
        </div>
        <div class="lm-filter-row lm-filter-row2">
          <input class="lm-search" id="lm-search" type="text" placeholder="Search action, actor, subject…"
                 oninput="ui.filterLogs()">
          <button class="lm-sev-btn" data-sev="" onclick="ui.setSevFilter(this,'')">All severity</button>
          <button class="lm-sev-btn" data-sev="error" onclick="ui.setSevFilter(this,'error')">🔴 Errors</button>
          <button class="lm-sev-btn" data-sev="warning" onclick="ui.setSevFilter(this,'warning')">🟡 Warnings</button>
          <button class="lm-sev-btn lm-sev-active" data-sev="clear" style="display:none" onclick="ui.setSevFilter(this,'')">✕ Clear</button>
          <span class="lm-count" id="lm-count">—</span>
        </div>
      </div>

      <!-- Log list -->
      <div class="lm-list" id="lm-list">
        <div class="lm-empty">Loading...</div>
      </div>
    </div>
  </div>

  <script src="scripts/SquidModal.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/api_v2.js"></script>
  <script src="scripts/PixelIcons.js"></script>
  <script src="scripts/PanelResizer.js"></script>
  <script src="scripts/JsonEditor.js"></script>
  <script src="scripts/EditorBrowser.js"></script>
  <script src="scripts/AgentForm.js"></script>
  <script src="scripts/TaskQueueUI.js"></script>
  <script src="scripts/ModelLoader.js"></script>
  <script src="scripts/PoseidonChat.js"></script>
  <script src="scripts/ControlTowerLive.js"></script>
  <script src="scripts/Scheduler.js"></script>
  <script src="scripts/ProjectsPanel.js"></script>
  <script src="scripts/Poseidon.js"></script>
  <script src="scripts/TempleInterior.js"></script>
  <script src="scripts/SquidInteractions.js"></script>
  <script src="scripts/SquidInteractionSystem.js"></script>
  <script src="scripts/SquidAccessories.js"></script>
  <script src="scripts/Squid.js"></script>
  <script src="scripts/aquarium.js"></script>
  <script>
    // Initialize on load
    window.addEventListener('load', async () => {
      console.log('[SQUID] SquidMind initializing...');
      await aquarium.init();
      await ui.init();
      console.log('[OK] SquidMind ready!');
    });
  </script>
  <script src="scripts/CommsPanel.js"></script>
</body>
</html>
